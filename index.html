<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KP POWERTECH</title>

  <!-- Favicon -->
  <link rel="icon" href="assets/favicon.ico" type="image/x-icon">

  <!-- Unified CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <img src="assets/logo.svg" alt="KP POWERTECH Logo" class="logo" style="height:50px;">
    <div id="darkToggle">🌙</div>
  </nav>

  <!-- Hero Section with Branded Background -->
  <section class="hero" style="
    background-image: url('assets/background.jpg');
    background-size: cover;
    background-position: center;
  ">
    <h1>Powering Innovation</h1>
    <p>Reliable energy solutions for modern businesses</p>
    <a href="#services" class="btn btn-green">Get Started</a>
  </section>

  <!-- Services Section -->
  <section id="services">
    <h2>Our Services</h2>
    <div class="card">Energy Consulting</div>
    <div class="card">Power Solutions</div>
    <div class="card">Sustainability Projects</div>
  </section>

  <!-- Floating WhatsApp -->
  <a href="https://wa.me/918105222992" target="_blank" id="whatsappBtn" class="whatsapp-btn">💬</a>

  <!-- Floating Quote Button -->
  <button id="quoteBtn" class="quote-btn">📝 Request a Quote</button>

  <!-- Sticky Contact Bar -->
  <div class="contact-bar">
    <a href="tel:08105222992" class="contact-icon">📞</a>
    <a href="mailto:info@kppowertech.in" class="contact-icon">✉️</a>
    <a href="https://wa.me/918105222992" target="_blank" class="contact-icon">💬</a>
  </div>

  <!-- Quote Modal -->
  <div id="quoteModal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h2>Request a Quote</h2>
      <form action="https://formspree.io/f/yourFormID" method="POST">
        <input type="text" name="name" placeholder="Your Name" required />
        <input type="email" name="email" placeholder="Your Email" required />
        <input type="tel" name="phone" placeholder="Phone Number" required />
        <textarea name="details" placeholder="Project Details"></textarea>
        <button type="submit" class="btn btn-green">Submit</button>
      </form>
    </div>
  </div>

  <!-- Success Popup -->
  <div id="successPopup" class="success-popup">✅ Your request has been submitted!</div>

  <!-- Unified JS -->
  <script src="script.js"></script>
</body>
</html>
